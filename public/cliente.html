<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cliente - AluguelCar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">🚗 AluguelCar</span>
      <div id="nav-user" class="text-white small"></div>
    </div>
  </nav>
  <main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4>Meus pedidos de aluguel</h4>
      <button class="btn btn-primary" id="btn-novo">+ Novo pedido</button>
    </div>
    <div class="card">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr><th>#</th><th>Automóvel</th><th>Proprietário</th><th>Crédito</th><th>Valor</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="tbody-pedidos"></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/cliente.js"></script>
</body>
</html>
