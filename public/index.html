<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - AluguelCar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><span class="navbar-brand">🚗 AluguelCar</span></div>
  </nav>
  <main class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4">
          <h4 class="mb-3">Entrar</h4>
          <div id="msg-login"></div>
          <form id="login-form">
            <input class="form-control mb-2" name="email" type="email" placeholder="E-mail" required>
            <input class="form-control mb-3" name="senha" type="password" placeholder="Senha" required>
            <button class="btn btn-dark w-100">Entrar</button>
          </form>
          <hr>
          <button id="btn-cad" class="btn btn-outline-primary w-100">Cadastrar-se</button>
          <p class="text-muted small mt-3 mb-0">Demo: cliente@teste.com / banco@teste.com / empresa@teste.com — senha 123</p>
        </div>
      </div>
    </div>
  </main>
  <div id="modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
